#############################################
# e-ink glass
#############################################

ecosystem:no_update_news = true

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = GDK_BACKEND,wayland

# unscale XWayland
xwayland {
  force_zero_scaling = true
}

# toolkit-specific scale
env = GDK_SCALE,2
env = XCURSOR_SIZE,32

monitor = eDP-1,1920x1080@60, auto, 1
monitor = eDP-1, addreserved, 14, 0, 0, 0
monitor = eDP-2,disable

exec-once = brightnessctl set 10%

# exec-once = swaybg -i ~/.config/wallpapers/eink_dark.jpg -m fill
exec-once = swaybg -i ~/.config/wallpapers/vagabond_mountain.jpg -m fill

# --- make the session vars visible to user services (portals, etc.) ---
exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user import-environment DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE

# --- bind the Hyprland portal and the umbrella portal to this session ---
# (small delay lets the compositor be fully ready)
exec-once = bash -lc 'sleep 0.6; systemctl --user restart xdg-desktop-portal-hyprland.service xdg-desktop-portal.service'

# --- start the bar after portals so GTK apps don’t stall waiting on the Settings portal ---
# exec-once = bash -lc 'sleep 1; waybar'

exec-once = waybar

$terminal = ghostty
$fileManager = nautilus

gestures {
    workspace_swipe_invert = true
    workspace_swipe_distance = 700
    gesture= 3, horizontal, workspace
    workspace_swipe_use_r =  true
    #workspace_swipe_forever = true
    workspace_swipe_cancel_ratio = 0.3
}

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

general {
    gaps_in = 8
    gaps_out = 10
    border_size = 1
    # use secondary for borders
    col.active_border   = rgba(333333cc)
    col.inactive_border = rgba(33333377)
    resize_on_border = true
    layout = dwindle
}


# center-master vibe like in the screenshots
master:orientation = center
master:mfact = 0.34

decoration {
    rounding = 22
    active_opacity   = 1.0
    inactive_opacity = 0.92

    shadow {
        enabled = true
        range = 30           # spread it further (softer edge)
        render_power = 2     # lower = less harsh falloff (2–2.5 is soft)
        color = rgba(00000055)  # lighter (lower alpha)
        # optional: tiny lift so it looks “floating”:
        offset = 0 4
    }

    blur {
        enabled = true
        size = 18
        passes = 3
        new_optimizations = on
        ignore_opacity = false
        vibrancy = 0.18
    }
}

animations {
    enabled = true
    bezier = ease, 0.15, 0.9, 0.1, 1.0
    animation = windows,    1, 6, ease
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border,     1, 10, default
    animation = fade,       1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

input {
    kb_layout  = us
    kb_options = grp:lalt_lshift_toggle
    numlock_by_default = true
    mouse_refocus = false
    accel_profile = flat
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

$mainMod = SUPER

# Binds
bind = CTRL SHIFT, left,  movewindow, l
bind = CTRL SHIFT, right, movewindow, r
bind = CTRL SHIFT, up,    movewindow, u
bind = CTRL SHIFT, down,  movewindow, d
bind = $mainMod, W, exec, wofi --show drun --prompt "" --location center --width 600
bind = $mainMod, Q, killactive
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Y, exec, alacritty
bind = CTRL SHIFT, 3, exec, grim
bind = CTRL SHIFT, 4, exec, grim -g "$(slurp)"
bind = CTRL SHIFT, 5, exec, ~/.config/hypr/scripts/wf-toggle-recorder.sh
bind = CTRL L_ALT, Q, exec, systemctl poweroff
bind = CTRL SHIFT, P, exec, hyprpicker -a
bind = $mainMod, B, exec, librewolf
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, S, exec, grim

bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = Super_L SHIFT, 1, movetoworkspace, 1
bind = Super_L SHIFT, 2, movetoworkspace, 2
bind = Super_L SHIFT, 3, movetoworkspace, 3
bind = Super_L SHIFT, 4, movetoworkspace, 4
bind = Super_L SHIFT, 5, movetoworkspace, 5
bind = Super_L SHIFT, 6, movetoworkspace, 6
bind = Super_L SHIFT, 7, movetoworkspace, 7
bind = Super_L SHIFT, 8, movetoworkspace, 8
bind = Super_L SHIFT, 9, movetoworkspace, 9
bind = Super_L SHIFT, 0, movetoworkspace, 10

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute,        exec, wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute,     exec, wpctl set-mute   @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp,   exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
bindl  = ,XF86AudioNext,  exec, playerctl next
bindl  = ,XF86AudioPause, exec, playerctl play-pause
bindl  = ,XF86AudioPlay,  exec, playerctl play-pause
bindl  = ,XF86AudioPrev,  exec, playerctl previous

# rules for “floating glass cards”
# float + center terminals as “cards”
windowrulev2 = float,        class:^(Alacritty)$
windowrulev2 = center,       class:^(Alacritty)$
windowrulev2 = size 500 780,class:^(Alacritty)$
windowrulev2 = rounding 22,  class:^(Alacritty)$

windowrulev2 = opacity 0.9 0.9,class:^(firefox)$

layerrule = blur, wofi
layerrule = ignorezero, wofi
